flutter_launcher_icons:
  image_path: "assets/images/dev/icon-dev.png"

  android: "launcher_icon"
  image_path_android: "assets/images/dev/icon-dev.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/images/dev/icon-dev.png"
  adaptive_icon_foreground_inset: 16

  ios: true
  image_path_ios: "assets/images/dev/icon-dev.png"
  remove_alpha_ios: true
  background_color_ios: "#1E3A8A"

  web:
    generate: true
    image_path: "assets/images/dev/icon-dev.png"
    background_color: "#1E3A8A"
    theme_color: "#1E3A8A"

  windows:
    generate: true
    image_path: "assets/images/dev/icon-dev.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/images/dev/icon-dev.png"